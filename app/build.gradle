plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.digitalbeavertz.ruqya'
    compileSdk 35

    defaultConfig {
        applicationId "com.digitalbeavertz.ruqya"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    // The permanent release key lives outside the project (never commit it). Its properties
    // file holds storeFile, storePassword, keyAlias and keyPassword. Without it (another PC),
    // release builds fall back to the debug key, which can't update installed copies.
    def releaseProps = new Properties()
    def releasePropsFile = file(project.findProperty("ruqyaSigning") ?: "C:/Users/user/.android/keys/ruqya-release.properties")
    if (releasePropsFile.exists()) releasePropsFile.withInputStream { releaseProps.load(it) }

    signingConfigs {
        release {
            if (releaseProps.storeFile) {
                storeFile file(releaseProps.storeFile)
                storePassword releaseProps.storePassword
                keyAlias releaseProps.keyAlias
                keyPassword releaseProps.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseProps.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    androidResources {
        // Per-app language (English / Kiswahili) in Android 13+ system settings.
        generateLocaleConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // Recitation: offline playback with a media notification (lock screen, headphones).
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'

    // Downloads the audio pack even if the person leaves the app.
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (android.jar only has stubs).
    testImplementation 'org.json:json:20180813'
}
